      <rect x="240" y="160" width="200" height="120" rx="6" fill="#fef0c6"/>
      <rect x="240" y="160" width="200" height="120" rx="6" fill="rgba(228,131,41,0.10)" stroke="#e48329" stroke-width="1.2"/>
      <rect x="248" y="166" width="28" height="12" rx="2" fill="transparent" stroke="rgba(228,131,41,0.60)" stroke-width="0.8"/>
      <text x="262" y="175" fill="#6b4a3a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="340" y="216" fill="#210501" font-size="16" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Biblio</text>
      <text x="340" y="236" fill="#6b4a3a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">desktop · Electron 22</text>
      <text x="340" y="252" fill="#6b4a3a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Windows 7+ · ia32</text>

      <!-- XLSX (store) -->
      <rect x="600" y="36" width="160" height="72" rx="6" fill="#fef0c6"/>
      <rect x="600" y="36" width="160" height="72" rx="6" fill="rgba(33,5,1,0.05)" stroke="#6b4a3a" stroke-width="1"/>
      <rect x="608" y="42" width="40" height="12" rx="2" fill="transparent" stroke="rgba(107,74,58,0.40)" stroke-width="0.8"/>
      <text x="628" y="51" fill="#6b4a3a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCO</text>
      <text x="680" y="72" fill="#210501" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Archivos XLSX</text>
      <text x="680" y="88" fill="#6b4a3a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">socios · cuotas · libros</text>
      <text x="680" y="100" fill="#6b4a3a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prestamos_historial</text>

      <!-- settings.json (store) -->
      <rect x="600" y="140" width="160" height="72" rx="6" fill="#fef0c6"/>
      <rect x="600" y="140" width="160" height="72" rx="6" fill="rgba(33,5,1,0.05)" stroke="#6b4a3a" stroke-width="1"/>
      <rect x="608" y="146" width="40" height="12" rx="2" fill="transparent" stroke="rgba(107,74,58,0.40)" stroke-width="0.8"/>
      <text x="628" y="155" fill="#6b4a3a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCO</text>
      <text x="680" y="180" fill="#210501" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">electron-store</text>
      <text x="680" y="196" fill="#6b4a3a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">settings.json</text>

      <!-- GitHub Releases (external) -->
      <rect x="600" y="244" width="160" height="72" rx="6" fill="#fef0c6"/>
      <rect x="600" y="244" width="160" height="72" rx="6" fill="rgba(33,5,1,0.03)" stroke="rgba(33,5,1,0.30)" stroke-width="1"/>
      <rect x="608" y="250" width="28" height="12" rx="2" fill="transparent" stroke="rgba(33,5,1,0.30)" stroke-width="0.8"/>
      <text x="622" y="259" fill="#7d5f4f" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="680" y="284" fill="#210501" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">GitHub Releases</text>
      <text x="680" y="300" fill="#6b4a3a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auto-actualizaciones</text>

      <!-- .mrc (external) -->
      <rect x="600" y="348" width="160" height="72" rx="6" fill="#fef0c6"/>
      <rect x="600" y="348" width="160" height="72" rx="6" fill="rgba(33,5,1,0.03)" stroke="rgba(33,5,1,0.30)" stroke-width="1"/>
      <rect x="608" y="354" width="28" height="12" rx="2" fill="transparent" stroke="rgba(33,5,1,0.30)" stroke-width="0.8"/>
      <text x="622" y="363" fill="#7d5f4f" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="680" y="388" fill="#210501" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Archivos .mrc</text>
      <text x="680" y="404" fill="#6b4a3a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Koha ILS · MARC21</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="440" x2="760" y2="440" stroke="rgba(33,5,1,0.10)" stroke-width="0.8"/>
      <text x="40" y="464" fill="#6b4a3a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="120" y="456" width="16" height="12" rx="2" fill="rgba(228,131,41,0.10)" stroke="#e48329" stroke-width="1"/>
      <text x="144" y="465" fill="#6b4a3a" font-size="8" font-family="'Geist Mono', monospace">el sistema</text>

      <rect x="232" y="456" width="16" height="12" rx="2" fill="rgba(33,5,1,0.05)" stroke="#6b4a3a" stroke-width="1"/>
      <text x="256" y="465" fill="#6b4a3a" font-size="8" font-family="'Geist Mono', monospace">archivo local</text>

      <line x1="356" y1="462" x2="380" y2="462" stroke="#e48329" stroke-width="1.2" marker-end="url(#c4ctx-arrow-accent)"/>
      <text x="388" y="465" fill="#6b4a3a" font-size="8" font-family="'Geist Mono', monospace">datos principales</text>

      <line x1="496" y1="462" x2="520" y2="462" stroke="#6b4a3a" stroke-width="1.2" marker-end="url(#c4ctx-arrow)"/>
      <text x="528" y="465" fill="#6b4a3a" font-size="8" font-family="'Geist Mono', monospace">local</text>

      <line x1="584" y1="462" x2="608" y2="462" stroke="#1f6f78" stroke-width="1.2" marker-end="url(#c4ctx-arrow-link)"/>
      <text x="616" y="465" fill="#6b4a3a" font-size="8" font-family="'Geist Mono', monospace">red (opcional)</text>
</svg>
