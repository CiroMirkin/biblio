<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c4-contexto-title c4-contexto-desc">
      <title id="c4-contexto-title">Biblio en contexto (C4 nivel 1)</title>
      <desc id="c4-contexto-desc">El bibliotecario usa Biblio, una app de escritorio que lee y escribe las planillas XLSX locales de socios, cuotas, libros e historial de préstamos, guarda sus ajustes en settings.json, busca actualizaciones en GitHub Releases e importa y exporta catálogos en archivos .mrc compatibles con Koha.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="c4ctx-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b4a3a"/></marker>
        <marker id="c4ctx-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e48329"/></marker>
        <marker id="c4ctx-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f6f78"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fef0c6"/>

      <!-- ===== Arrows (drawn before nodes) ===== -->

      <!-- Bibliotecario → Biblio -->
      <line x1="184" y1="220" x2="240" y2="220" stroke="#6b4a3a" stroke-width="1.2" marker-end="url(#c4ctx-arrow)"/>
      <rect x="196" y="200" width="32" height="12" rx="2" fill="#fef0c6"/>
      <text x="212" y="209" fill="#7d5f4f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USA</text>

      <!-- Biblio → XLSX (primary data) -->
      <path d="M 440,184 H 464 Q 472,184 472,176 V 80 Q 472,72 480,72 H 600" fill="none" stroke="#e48329" stroke-width="1.2" marker-end="url(#c4ctx-arrow-accent)"/>
      <rect x="500" y="52" width="80" height="12" rx="2" fill="#fef0c6"/>
      <text x="540" y="61" fill="#7d5f4f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEE · ESCRIBE</text>

      <!-- Biblio → settings.json -->
      <path d="M 440,208 H 496 Q 504,208 504,200 V 184 Q 504,176 512,176 H 600" fill="none" stroke="#6b4a3a" stroke-width="1.2" marker-end="url(#c4ctx-arrow)"/>
      <rect x="524" y="156" width="64" height="12" rx="2" fill="#fef0c6"/>
      <text x="556" y="165" fill="#7d5f4f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AJUSTES</text>

      <!-- Biblio → GitHub Releases -->
      <path d="M 440,232 H 496 Q 504,232 504,240 V 272 Q 504,280 512,280 H 600" fill="none" stroke="#1f6f78" stroke-width="1.2" marker-end="url(#c4ctx-arrow-link)"/>
      <rect x="520" y="260" width="72" height="12" rx="2" fill="#fef0c6"/>
      <text x="556" y="269" fill="#7d5f4f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ACTUALIZA</text>

      <!-- Biblio → .mrc -->
      <path d="M 440,256 H 464 Q 472,256 472,264 V 376 Q 472,384 480,384 H 600" fill="none" stroke="#6b4a3a" stroke-width="1.2" marker-end="url(#c4ctx-arrow)"/>
      <rect x="492" y="364" width="96" height="12" rx="2" fill="#fef0c6"/>
      <text x="540" y="373" fill="#7d5f4f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IMPORTA · EXPORTA</text>

      <!-- ===== Nodes ===== -->

      <!-- Bibliotecario (user) -->
      <rect x="40" y="184" width="144" height="72" rx="6" fill="#fef0c6"/>
      <rect x="40" y="184" width="144" height="72" rx="6" fill="rgba(107,74,58,0.10)" stroke="#7d5f4f" stroke-width="1"/>
      <rect x="48" y="190" width="44" height="12" rx="2" fill="transparent" stroke="rgba(125,95,79,0.40)" stroke-width="0.8"/>
      <text x="70" y="199" fill="#7d5f4f" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERSONA</text>
      <text x="112" y="228" fill="#210501" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Bibliotecario</text>
      <text x="112" y="244" fill="#6b4a3a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">préstamos · socios</text>

